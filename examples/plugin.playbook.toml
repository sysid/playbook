schema_version = 3

[variables]
APP_NAME = { default = "demo-app", description = "Application name" }
WAIT_SECONDS = { default = 1, type = "int", min = 0, max = 10 }

[runbook]
id = "python-plugin-demo"
title = "Python plugin demonstration"
description = "Demonstrate step-scoped built-in plugin functions."
version = "2.0.0"
author = "Playbook Team"

[[steps]]
id = "announce"
type = "function"
name = "Announce the demonstration"
instructions = "Call the built-in notification function."
plugin = "python"
function = "notify"
params = { message = "Starting plugin demonstration for {{ APP_NAME }}" }

[[steps]]
id = "wait"
type = "function"
name = "Wait briefly"
instructions = "Demonstrate a parameterized plugin call."
plugin = "python"
function = "sleep"
params = { seconds = "{{ WAIT_SECONDS }}" }
verify = "Did the function complete normally?"

[[steps]]
id = "finish"
type = "manual"
name = "Review the result"
instructions = "Confirm that both plugin steps completed and their output was shown."
prompt = "Is the demonstration complete?"
