schema_version = 2

[variables]
APP_NAME = { default = "myapp", description = "Application name" }
ENVIRONMENT = { required = true, choices = ["dev", "staging", "prod"] }
VERSION = { default = "latest", description = "Application version" }
RUN_SECURITY = { default = true, type = "bool" }
API_KEY = { required = true, secret = true }

[runbook]
id = "deploy-application"
title = "Deploy {{ APP_NAME }}"
description = "Guide an operator through a sample deployment."
version = "2.0.0"
author = "DevOps"

[[steps]]
id = "review"
type = "manual"
name = "Review deployment"
instructions = "Review {{ APP_NAME }} version {{ VERSION }} for {{ ENVIRONMENT }}."
prompt = "Are the change and rollback plans approved?"

[[steps]]
id = "security-review"
type = "command"
name = "Run security review"
instructions = "Run the example read-only security check."
command = "printf 'Security review for %s\\n' '{{ APP_NAME }}'"
enabled_if = "RUN_SECURITY"
verify = "Did the security review pass?"

[[steps]]
id = "deploy"
type = "command"
name = "Run example deployment"
instructions = "This example only prints the intended deployment."
command = "printf 'Deploy %s version %s to %s\\n' '{{ APP_NAME }}' '{{ VERSION }}' '{{ ENVIRONMENT }}'"
verify = "Does the printed deployment target match the approved change?"

[[steps]]
id = "notify"
type = "function"
name = "Record completion"
instructions = "Emit a local completion notification."
plugin = "python"
function = "notify"
params = { message = "Deployed {{ APP_NAME }} {{ VERSION }} to {{ ENVIRONMENT }}" }
