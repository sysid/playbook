schema_version = 2

[runbook]
id = "system-overview"
title = "System overview"
description = "Collect a read-only local system overview."
version = "2.0.0"
author = "Playbook Team"

[[steps]]
id = "prepare"
type = "manual"
name = "Prepare the terminal"
instructions = "Confirm that this workflow is running on the intended machine."
prompt = "Is this the intended machine?"

[[steps]]
id = "collect-overview"
type = "command"
name = "Collect system overview"
instructions = "Run read-only commands that identify the current host and disk usage."
command = """
set -eu
date
pwd
whoami
uname -a
df -h
"""
timeout_seconds = 60
verify = "Does the output describe the intended machine?"

[[steps]]
id = "record-observations"
type = "manual"
name = "Record observations"
instructions = "Record unusual capacity or identity information in the operations log."
required = false
