schema_version = 3

[variables]
SLACK_WEBHOOK = { required = true, secret = true }
APP_NAME = { default = "demo-app" }
VERSION = { default = "1.0.0" }

[runbook]
id = "slack-notification"
title = "Slack notification"
description = "Send one deployment notification through the Slack plugin."
version = "2.0.0"
author = "DevOps"

[[steps]]
id = "review"
type = "manual"
name = "Review notification"
instructions = "Confirm the Slack channel and message content before sending."
prompt = "Is the notification approved?"

[[steps]]
id = "notify"
type = "function"
name = "Send notification"
instructions = "Send the approved deployment message."
plugin = "slack"
function = "send_message"
params = { text = "{{ APP_NAME }} {{ VERSION }} deployment started", channel = "#deployments", urgency = "normal" }
config = { webhook_url = "{{ SLACK_WEBHOOK }}", timeout = 30 }
verify = "Was the Slack message delivered?"
