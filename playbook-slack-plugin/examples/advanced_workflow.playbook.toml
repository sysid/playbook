schema_version = 2

[variables]
SLACK_WEBHOOK = { required = true, secret = true }
SLACK_BOT_TOKEN = { required = true, secret = true }
PROJECT_NAME = { required = true }
ENVIRONMENT = { required = true, choices = ["dev", "staging", "prod"] }
DEPLOY_LOG_PATH = { default = "/tmp/deployment.log" }

[runbook]
id = "slack-deployment-guide"
title = "Slack deployment guide"
description = "Create a deployment channel, upload a log, and notify the team."
version = "2.0.0"
author = "DevOps"

[[steps]]
id = "review"
type = "manual"
name = "Review Slack actions"
instructions = "Confirm that creating a channel and posting the deployment log are approved."
prompt = "Are the Slack actions approved?"

[[steps]]
id = "create-channel"
type = "function"
name = "Create deployment channel"
instructions = "Create a public channel for deployment coordination."
plugin = "slack"
function = "create_channel"
params = { name = "deploy-{{ PROJECT_NAME | lower }}-{{ ENVIRONMENT }}", purpose = "Deployment coordination" }
config = { bot_token = "{{ SLACK_BOT_TOKEN }}", timeout = 30 }
verify = "Was the channel created?"

[[steps]]
id = "create-log"
type = "command"
name = "Create example log"
instructions = "Create a short local deployment log for the upload example."
command = "printf 'Deployment log for %s in %s\\n' '{{ PROJECT_NAME }}' '{{ ENVIRONMENT }}' > '{{ DEPLOY_LOG_PATH }}'"

[[steps]]
id = "upload-log"
type = "function"
name = "Upload deployment log"
instructions = "Upload the example log to the deployments channel."
plugin = "slack"
function = "send_file"
params = { file_path = "{{ DEPLOY_LOG_PATH }}", channels = "#deployments", title = "Deployment log" }
config = { bot_token = "{{ SLACK_BOT_TOKEN }}", timeout = 30 }
verify = "Was the file uploaded?"

[[steps]]
id = "notify"
type = "function"
name = "Send completion notification"
instructions = "Notify the main deployments channel."
plugin = "slack"
function = "send_message"
params = { text = "{{ PROJECT_NAME }} deployment workflow completed", channel = "#deployments", urgency = "normal" }
config = { webhook_url = "{{ SLACK_WEBHOOK }}", timeout = 30 }
verify = "Was the completion message delivered?"
