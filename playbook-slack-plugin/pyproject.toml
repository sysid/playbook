[project]
name = "playbook-slack"
version = "1.0.0"
description = "Slack integration plugin for Playbook"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "sysid", email = "sysid@gmx.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "playbook>=2.0.0,<3",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.19",
]

[project.entry-points."playbook.plugins"]
slack = "playbook_slack.plugin:SlackPlugin"

[project.urls]
Homepage = "https://github.com/sysid/playbook"
Repository = "https://github.com/sysid/playbook"
Issues = "https://github.com/sysid/playbook/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
playbook = { path = "..", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"

[tool.coverage.run]
source = ["src/playbook_slack"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
