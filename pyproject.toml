[project]
name = "playbook"
version = "2.0.0"
description = "A guided, step-by-step workflow runner for operations"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.13"
authors = [
    { name = "sysid", email = "sysid@gmx.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click==8.1.8",
    "jinja2>=3.1.0",
    "pydantic>=2.11.4",
    "pyyaml>=6.0.0",
    "rich>=14.0.0",
    "tomlkit>=0.13.0",
    "typer>=0.15.3",
]

[dependency-groups]
dev = [
    "bump-my-version>=0.28.1",
    "pre-commit>=4.5.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.19",
]

[project.scripts]
playbook = "playbook.cli.main:app"

[project.entry-points."playbook.plugins"]
python = "playbook.infrastructure.plugins.python_plugin:PythonPlugin"

[project.urls]
Homepage = "https://github.com/sysid/playbook"
Repository = "https://github.com/sysid/playbook"
Issues = "https://github.com/sysid/playbook/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.bumpversion]
current_version = "2.0.0"
commit = true
tag = false
message = "Bump version to {new_version}"

[tool.bumpversion.file_patterns]
"src/playbook/__init__.py" = [
    { search = "__version__ = \"{current_version}\"", replace = "__version__ = \"{new_version}\"" },
]
"VERSION" = [
    { search = "{current_version}", replace = "{new_version}" },
]
"pyproject.toml" = [
    { search = "version = \"{current_version}\"", replace = "version = \"{new_version}\"" },
]

[[tool.bumpversion.files]]
filename = "VERSION"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "src/playbook/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"

[tool.coverage.run]
source = ["src/playbook"]
omit = [
    "tests/*",
    "**/__main__.py",
    "**/.venv/*",
    "**/site-packages/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
